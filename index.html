<!DOCTYPE html>
<html>
    <head>
        <title>Sorting Algorithm Visualizer</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <style>
            :root {
                --bg: #0e0b14;
                --surface: #18152a;
                --surface-2: #201c34;
                --text: #ede9f8;
                --muted: #9087b4;
                --border: #332d52;
                --accent: #a78bfa;
                --accent-hover: #8b5cf6;
                --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
                --radius: 12px;
            }

            *, *::before, *::after { box-sizing: border-box; }
            html, body { height: 100%; overflow: hidden; }
            body {
                margin: 0;
                font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
                color: var(--text);
                background: var(--bg);
                font-size: 14px;
                -webkit-font-smoothing: antialiased;
            }

            button {
                border: 1px solid var(--border);
                background: var(--surface-2);
                color: var(--text);
                border-radius: 8px;
                padding: 11px 14px;
                cursor: pointer;
                font-size: 14px;
                font-family: inherit;
                font-weight: 500;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 7px;
                transition: background 0.15s, border-color 0.15s;
                line-height: 1;
            }
            button:hover { background: var(--border); }

            input[type="range"] { accent-color: var(--accent); cursor: pointer; }
            label { cursor: pointer; }

            /* Invert dark SVG icons to white */
            .icon-img {
                filter: brightness(0) invert(1);
                opacity: 0.75;
                transition: opacity 0.15s;
                flex-shrink: 0;
            }

            /* Social icon links */
            .social-link {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 6px;
                border-radius: 8px;
                text-decoration: none;
                transition: background 0.15s;
            }
            .social-link:hover { background: var(--surface-2); }
            .social-link:hover .icon-img { opacity: 1; }

            /* Hamburger toggle */
            .menu-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                border-radius: 8px;
                background: var(--surface-2);
                border: 1px solid var(--border);
                cursor: pointer;
                transition: background 0.15s, border-color 0.15s;
            }
            .menu-toggle:hover { background: var(--border); border-color: var(--accent); }
            .menu-toggle .icon-img { opacity: 1; }

            /* Primary button */
            .btn-primary {
                background: var(--accent) !important;
                border-color: var(--accent) !important;
                color: #fff !important;
            }
            .btn-primary:hover {
                background: var(--accent-hover) !important;
                border-color: var(--accent-hover) !important;
            }

            /* Secondary button */
            .btn-secondary {
                background: var(--surface-2) !important;
                border-color: var(--border) !important;
                color: var(--text) !important;
            }
            .btn-secondary:hover {
                background: var(--border) !important;
                border-color: var(--accent) !important;
            }

            .nav-bar { border-bottom: 1px solid var(--border); }

            .side-menu {
                border-left: 1px solid var(--border);
                overflow-y: auto;
                transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            }

            /* Section label */
            .section-title {
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--text);
            }

            /* Divider between menu sections (via adjacent sibling) */
            .menu-section + .menu-section {
                border-top: 1px solid var(--border);
                padding-top: 20px;
            }

            /* Algorithm toggle buttons */
            .algo-btn {
                flex: 1;
                padding: 9px 6px;
                border-radius: 6px;
                font-size: 13px;
                font-weight: 500;
                background: transparent;
                border: 1px solid var(--border);
                color: var(--muted);
                transition: all 0.15s;
                cursor: pointer;
            }
            .algo-btn:hover { color: var(--text); border-color: var(--accent); background: var(--surface-2); }
            .algo-btn-active { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
            .algo-btn-active:hover { background: var(--accent-hover) !important; border-color: var(--accent-hover) !important; }

            /* Speed badge */
            .speed-badge {
                display: inline-block;
                background: var(--surface-2);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 2px 8px;
                font-size: 12px;
                font-weight: 600;
                color: var(--accent);
                margin-top: 6px;
            }

            /* Error modal close button */
            .modal-close {
                position: absolute;
                top: 12px;
                right: 12px;
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 8px;
                cursor: pointer;
                color: var(--muted);
                font-size: 16px;
                transition: background 0.15s, color 0.15s;
            }
            .modal-close:hover { background: var(--surface-2); color: var(--text); }

            @media (max-width: 768px) {
                .side-menu { width: 100% !important; border-left: none; border-top: 1px solid var(--border); }
                .page-content { width: 100% !important; }
                .legend-bar { width: 100% !important; }
            }
        </style>
    </head>
    <body style="margin: 0;">
        <script
            type="text/javascript"
            src="./presentation/presentation-opt/main.js"
        ></script>
    </body>
</html>
